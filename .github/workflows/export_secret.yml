name: Securely Export Secret

on:
  workflow_dispatch:
    inputs:
      secret_name:
        description: 'Exportしたいシークレット名 (例: MY_API_KEY)'
        required: true
        type: string
      public_key_path:
        description: 'リポジトリ内の公開鍵ファイルへのパス'
        required: true
        default: 'public_key.pem'
        type: string

jobs:
  export-secret:
    runs-on: ubuntu-latest
    steps:
      # ステップ1: リポジトリのコードをチェックアウトして公開鍵ファイルにアクセスする
      - name: Checkout repository
        uses: actions/checkout@v4

      # ステップ2: 指定されたシークレットを公開鍵で暗号化する
      - name: Encrypt the secret with the public key
        id: encrypt_secret
        run: |
          # 指定されたシークレットが空でないかチェック
          if [ -z "${{ secrets[github.event.inputs.secret_name] }}" ]; then
            echo "Error: シークレット '${{ github.event.inputs.secret_name }}' が見つからないか、空です。"
            exit 1
          fi

          # シークレットを環境変数経由でファイルに書き込み、公開鍵で暗号化
          echo -n "${{ secrets[github.event.inputs.secret_name] }}" | openssl pkeyutl \
            -encrypt \
            -pubin \
            -inkey "${{ github.event.inputs.public_key_path }}" \
            -out encrypted_secret.bin

          echo "シークレットの暗号化が完了しました。"

      # ステップ3: 暗号化されたシークレットをアーティファクトとしてアップロードする
      - name: Upload encrypted secret as artifact
        uses: actions/upload-artifact@v4
        with:
          name: encrypted-secret-for-${{ github.event.inputs.secret_name }}
          path: encrypted_secret.bin
          retention-days: 1 # アーティファクトの保持期間を1日に設定